e cx="8070.11" cy="698.8253" fill="none" rx="3" ry="3" style="stroke:#038048;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="75.3867" x="8079.11" y="702.172">reason: str</text><line style="stroke:#181818;stroke-width:0.5;" x1="8060.11" x2="8220.403" y1="709.4737" y2="709.4737"/></g><g class="entity" data-qualified-name="GMN231" data-source-line="721" id="ent0232"><path d="M3174.6,1102.96 L3174.6,1172.06 L3139.93,1176.06 L3174.6,1180.06 L3174.6,1249.1553 A0,0 0 0 0 3174.6,1249.1553 L3427.9115,1249.1553 A0,0 0 0 0 3427.9115,1249.1553 L3427.9115,1112.96 L3417.9115,1102.96 L3174.6,1102.96 A0,0 0 0 0 3174.6,1102.96" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3417.9115,1102.96 L3417.9115,1112.96 L3427.9115,1112.96 L3417.9115,1102.96" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111.8394" x="3180.6" y="1120.0269">AssistantAgent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.1499" x="3296.5717" y="1120.0269">is the main agent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.3115" x="3180.6" y="1135.1597">for tool use and model interactions.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="3180.6" y="1150.2925">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="86.7217" x="3180.6" y="1165.4253">Key features:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.439" x="3180.6" y="1180.5581">- Can use tools or workbenches</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.1021" x="3180.6" y="1195.691">- Supports handoffs to other agents</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.2363" x="3180.6" y="1210.8238">- Memory integration</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.292" x="3180.6" y="1225.9566">- Streaming support</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.8457" x="3180.6" y="1241.0894">- Structured output</text></g><g class="entity" data-qualified-name="GMN234" data-source-line="733" id="ent0235"><path d="M2297.52,1381.04 L2297.52,1427.43 L2262.2,1431.43 L2297.52,1435.43 L2297.52,1481.8369 A0,0 0 0 0 2297.52,1481.8369 L2584.9883,1481.8369 A0,0 0 0 0 2584.9883,1481.8369 L2584.9883,1391.04 L2574.9883,1381.04 L2297.52,1381.04 A0,0 0 0 0 2297.52,1381.04" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2574.9883,1381.04 L2574.9883,1391.04 L2584.9883,1391.04 L2574.9883,1381.04" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="82.6655" x="2303.52" y="1398.1069">Workbench</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.4814" x="2390.3179" y="1398.1069">provides a collection</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.5278" x="2303.52" y="1413.2397">of tools that share state and resources.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="2303.52" y="1428.3725">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.0903" x="2303.52" y="1443.5053">Different from individual Tools:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.5059" x="2303.52" y="1458.6381">- Stati